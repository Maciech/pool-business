<div class="bar wrap">
  <a class="brand" href="#top" aria-label="{{ business.name }} home">
    <span class="brand__mark" aria-hidden="true">
      <svg viewBox="0 0 40 40">
        <circle cx="20" cy="20" r="18" />
        <path d="M6 23c3.5 0 3.5-3 7-3s3.5 3 7 3 3.5-3 7-3 3.5 3 7 3" />
        <path d="M8 29c3 0 3-2.5 6-2.5s3 2.5 6 2.5 3-2.5 6-2.5 3 2.5 6 2.5" />
      </svg>
    </span>
    <span class="brand__name">Halcyon<em>Lido</em></span>
  </a>

  <nav id="site-nav" class="nav" [class.is-open]="menuOpen()" aria-label="Main">
    <ul>
      @for (link of links; track link.href) {
        <li><a [href]="link.href" (click)="menuOpen.set(false)">{{ link.label }}</a></li>
      }
    </ul>
    <a class="btn btn--sun nav__cta" href="#contact" (click)="menuOpen.set(false)">Book a visit</a>
  </nav>

  <a class="status" href="#hours" [class.is-open]="hours.isOpen()">
    <span class="status__dot" aria-hidden="true"></span>
    <span>{{ hours.status() }}</span>
  </a>

  <button
    class="burger"
    type="button"
    [attr.aria-expanded]="menuOpen()"
    aria-controls="site-nav"
    (click)="toggleMenu()"
  >
    <span class="visually-hidden">{{ menuOpen() ? 'Close menu' : 'Open menu' }}</span>
    <span class="burger__line"></span>
    <span class="burger__line"></span>
  </button>
</div>
