<svg class="defs" width="0" height="0">
  <defs>
    <!--
      Turbulence noise turned into thin bright ridges: only values close to the
      middle of the range survive, which draws the wobbly net of light that
      sunlight casts through rippling water.
    -->
    <filter [attr.id]="ids.a" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.009 0.013" numOctaves="2" seed="4" />
      <feColorMatrix type="matrix" [attr.values]="colorMatrix()" />
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0 0 0 0.05 0.85 0.05 0 0 0 0" />
      </feComponentTransfer>
      <feGaussianBlur stdDeviation="0.6" />
    </filter>
    <filter [attr.id]="ids.b" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.008" numOctaves="2" seed="11" />
      <feColorMatrix type="matrix" [attr.values]="colorMatrix()" />
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0 0 0 0.05 0.7 0.05 0 0 0 0" />
      </feComponentTransfer>
      <feGaussianBlur stdDeviation="0.8" />
    </filter>
  </defs>
</svg>

<div class="caustics caustics--a">
  <svg width="100%" height="100%"><rect width="100%" height="100%" [attr.filter]="'url(#' + ids.a + ')'" /></svg>
</div>
<div class="caustics caustics--b">
  <svg width="100%" height="100%"><rect width="100%" height="100%" [attr.filter]="'url(#' + ids.b + ')'" /></svg>
</div>

<div class="glints"></div>

@if (showSwells()) {
  @for (s of swells; track $index) {
    <svg
      class="swell"
      [style.top.%]="s.top"
      [style.opacity]="s.opacity"
      [style.--shift.px]="-s.period"
      [style.animation-duration.s]="s.duration"
      [attr.height]="s.amp * 2 + 4"
      width="2880"
    >
      <path [attr.d]="s.d" [attr.transform]="'translate(0 2)'" />
    </svg>
  }
}
